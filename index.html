<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議員質詢題庫查詢系統｜第3屆第5-7次會期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152a4a;
    --ink-2:#24406b;
    --teal:#0e6f6b;
    --teal-light:#e4f1f0;
    --amber:#b8842f;
    --amber-light:#faf1e0;
    --paper:#f3f5f8;
    --card:#ffffff;
    --line:#dde3ec;
    --text:#1c2432;
    --text-dim:#5b6472;
    --danger:#a4453a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header.masthead{
    background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 65%,#1a4f57 100%);
    color:#f4f7fb;
    padding:36px 28px 30px;
    position:relative;
    overflow:hidden;
  }
  header.masthead::after{
    content:"";
    position:absolute; right:-60px; top:-60px;
    width:260px; height:260px;
    border:1px solid rgba(244,247,251,0.14);
    border-radius:50%;
  }
  header.masthead::before{
    content:"";
    position:absolute; right:20px; bottom:-90px;
    width:200px; height:200px;
    border:1px solid rgba(244,247,251,0.1);
    border-radius:50%;
  }
  .eyebrow{
    font-size:12.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#bcd3d1; font-weight:600; margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 8px;
    letter-spacing:.02em;
    position:relative;
  }
  .sub{
    color:#cfe0de; font-size:14.5px; max-width:640px; line-height:1.7;
    position:relative;
  }
  .stat-strip{
    display:flex; gap:0; margin-top:26px; flex-wrap:wrap;
    position:relative;
  }
  .stat{
    padding:6px 26px 6px 0; margin-right:26px;
    border-right:1px solid rgba(244,247,251,0.22);
  }
  .stat:last-child{border-right:none;}
  .stat .num{font-family:'Noto Serif TC',serif; font-size:26px; font-weight:700; color:#fff; line-height:1;}
  .stat .lbl{font-size:12px; color:#a9c6c3; margin-top:4px;}

  .toolbar{
    max-width:1240px; margin:-22px auto 0; padding:0 20px;
    position:relative; z-index:2;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 10px 30px -18px rgba(21,42,74,0.35);
    padding:20px 22px;
  }
  .search-row{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search-box{
    flex:1 1 320px; position:relative;
  }
  .search-box input{
    width:100%; padding:12px 16px 12px 40px; border-radius:9px;
    border:1.5px solid var(--line); font-size:15px; font-family:inherit;
    background:#fbfcfe; color:var(--text); transition:border-color .15s, box-shadow .15s;
  }
  .search-box input:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-light);
  }
  .search-box svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke:var(--text-dim);
  }
  select, .member-input{
    padding:11px 14px; border-radius:9px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14.5px; background:#fbfcfe; color:var(--text);
    min-width:160px;
  }
  select:focus, .member-input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-light);}
  .btn-reset{
    padding:11px 16px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; color:var(--text-dim); font-family:inherit; font-size:14px;
    cursor:pointer; font-weight:600; transition:all .15s;
    white-space:nowrap;
  }
  .btn-reset:hover{border-color:var(--danger); color:var(--danger); background:#fdf4f3;}

  .divider{height:1px; background:var(--line); margin:16px 0;}

  .cat-label{
    font-size:12.5px; font-weight:700; color:var(--text-dim); letter-spacing:.05em;
    margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .cat-label .count-badge{
    background:var(--teal-light); color:var(--teal); border-radius:20px;
    padding:1px 9px; font-size:11.5px; font-weight:700;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:7px 13px; border-radius:20px; border:1.4px solid var(--line);
    background:#fff; font-size:13px; font-weight:600; color:var(--text-dim);
    cursor:pointer; transition:all .12s; user-select:none;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip .n{color:#9aa3b2; font-weight:500; font-size:11.5px;}
  .chip:hover{border-color:var(--teal); color:var(--teal);}
  .chip.active{
    background:var(--teal); border-color:var(--teal); color:#fff;
  }
  .chip.active .n{color:#d7ece9;}

  .member-chips-wrap{position:relative;}
  .member-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 14px 34px -14px rgba(21,42,74,0.3);
    max-height:260px; overflow-y:auto; z-index:20; display:none;
  }
  .member-dropdown.show{display:block;}
  .member-opt{
    padding:9px 14px; font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between;
    color:var(--text);
  }
  .member-opt:hover{background:var(--teal-light);}
  .member-opt .cnt{color:var(--text-dim); font-size:12px;}
  .member-opt.selected{background:var(--amber-light); font-weight:700;}

  .active-filters{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; min-height:0;
  }
  .tag-pill{
    background:var(--amber-light); color:var(--amber); border:1px solid #ecd9b3;
    padding:5px 10px 5px 12px; border-radius:20px; font-size:12.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tag-pill button{
    background:none; border:none; color:var(--amber); cursor:pointer; font-size:14px;
    line-height:1; padding:0; font-weight:900;
  }

  .results-meta{
    max-width:1240px; margin:22px auto 10px; padding:0 20px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .results-count{font-size:14.5px; color:var(--text-dim);}
  .results-count b{color:var(--ink); font-family:'Noto Serif TC',serif; font-size:17px;}
  .sort-control{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-dim);}
  .sort-control select{min-width:auto; padding:7px 10px; font-size:13px;}

  .list{
    max-width:1240px; margin:0 auto 60px; padding:0 20px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; transition:border-color .12s, box-shadow .12s;
  }
  .card:hover{border-color:#c3d3e0; box-shadow:0 6px 18px -12px rgba(21,42,74,0.25);}
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:8px; flex-wrap:wrap;
  }
  .who{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .member-name{
    font-weight:700; color:var(--ink); font-size:15px; font-family:'Noto Serif TC',serif;
  }
  .meta-bits{
    color:var(--text-dim); font-size:12.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .meta-bits .dot{color:#c6cdd8;}
  .badge-session{
    background:#eef2f8; color:var(--ink-2); border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:700;
  }
  .case-no{color:#9aa3b2; font-size:11.5px; font-family:monospace;}
  .topic{
    font-size:15px; line-height:1.75; color:var(--text); margin:6px 0 10px;
    white-space:pre-wrap;
  }
  .card-tags{display:flex; gap:6px; flex-wrap:wrap;}
  .card-tag{
    font-size:11.5px; font-weight:700; color:var(--teal); background:var(--teal-light);
    padding:3px 9px; border-radius:6px;
  }
  mark{background:#fce8a8; color:inherit; border-radius:3px; padding:0 1px;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--text-dim);
  }
  .empty-state .icon{font-size:38px; margin-bottom:14px;}
  .empty-state h3{font-family:'Noto Serif TC',serif; color:var(--ink); margin:0 0 8px;}

  footer{
    text-align:center; padding:24px; color:#8b95a5; font-size:12px;
  }

  @media (max-width:640px){
    header.masthead{padding:28px 18px 24px;}
    .stat-strip{gap:0;}
    .stat{padding-right:16px; margin-right:16px;}
    .panel{padding:16px;}
    .card-top{flex-direction:column;}
  }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#c7d0dc; border-radius:8px;}
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">桃園市議會 ・ 質詢題庫資料庫</div>
  <h1>議員質詢題目查詢系統</h1>
  <div class="sub">彙整第3屆第5次～第7次定期會（含臨時會、機關函詢）議員質詢題目與時間，提供分類篩選、議員篩選與關鍵字搜尋，協助長官快速掌握議員關注議題與備詢重點。</div>
  <div class="stat-strip" id="statStrip"></div>
</header>

<div class="toolbar">
  <div class="panel">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="keywordInput" type="text" placeholder="搜尋題目關鍵字、案號…（例如：長照、清大、疫苗）">
      </div>
      <select id="sessionSelect"></select>
      <div class="member-chips-wrap">
        <input class="member-input" id="memberInput" placeholder="篩選議員姓名…" autocomplete="off" style="width:180px;">
        <div class="member-dropdown" id="memberDropdown"></div>
      </div>
      <button class="btn-reset" id="resetBtn">清除所有篩選</button>
    </div>

    <div class="divider"></div>

    <div class="cat-label">依質詢類型篩選 <span class="count-badge" id="catActiveCount" style="display:none;"></span></div>
    <div class="chips" id="categoryChips"></div>

    <div class="active-filters" id="activeFilters"></div>
  </div>
</div>

<div class="results-meta">
  <div class="results-count">符合條件：<b id="resultCount">0</b> 筆 / 共 <span id="totalCount">0</span> 筆質詢紀錄</div>
  <div class="sort-control">
    排序：
    <select id="sortSelect">
      <option value="date-desc">日期（新→舊）</option>
      <option value="date-asc">日期（舊→新）</option>
      <option value="member">議員姓名</option>
      <option value="no">原始序號</option>
    </select>
  </div>
</div>

<div class="list" id="listContainer"></div>

<footer>資料來源：桃園市議會第3屆第5～7次定期會議員質詢紀錄（含臨時會與機關函詢）・ 依題目內容自動分類，分類結果僅供參考</footer>

在要開立第二家醫院嗎?", "member": "魏筠議員", "date": "114/04/08", "tags": ["醫院興建與醫療資源"]}, {"no": 256, "case": "O-1140930-0002", "term": "第3屆", "session": "第17次臨時會", "topic": "高風險孕產婦追蹤關懷計畫，服務個案服務數及追蹤案件次數低，有發生個案紀錄相同情事，另未提供孕程及新生兒衛教，監督及檢討機制為何？", "member": "黃瓊慧議員", "date": "114/09/26", "tags": ["婦幼與生育健康"]}, {"no": 257, "case": "P-1140923-0009", "term": "第3屆", "session": "第16次臨時會", "topic": "桃園市立醫院現在進度以及因應未來人、車大幅增加，針對周邊道路、交通改善配置規劃情形，請相關局處彙整詳細報告。", "member": "段樹文議員", "date": "114/09/23", "tags": ["醫院興建與醫療資源"]}, {"no": 258, "case": "P-1140923-0003", "term": "第3屆", "session": "第16次臨時會", "topic": "提升都會型社區癌症篩檢品質與第一線人力支持之政策檢討\n1.議案說明\n癌症為國人十大死因之首，政府多年投入經費推動篩檢。然而，實務執行上仍存有制度斷層與轉診困境。以桃園區為例，雖為都會核心，114 年度乳癌篩檢完成率僅55.4%，排名全市倒數第12（如衛生局公開統計表）。若前端社區篩檢無法有效轉銜，則將使整體政策流於形式。\n案例警訊\n以實際案例為例：有桃園市民眾於社區篩檢中被驗出異常，卻因轉診制度僵化、院所責任模糊，導致延誤診斷。原本可能在 0 期或早期處理的病灶，最後確診時已經惡化為第三期乳癌。這不僅是個案悲劇，更是制度漏洞的放大。\n2.問題檢討\n(1)社篩制度缺陷\nA.院所責任模糊，轉診流程僵化，延誤確診。\nB.助產所雖為合法採檢單位，卻未納入轉診系統，導致婦幼族群風險升高。\n(2)都會型挑戰\nA.桃園區屬人口稠密、流動性高之都會型社區，里民對篩檢意識不足，導致篩檢動員困難。\nB.高壓的衛生所人力承擔大量業務，民眾抱怨多直接壓向基層人員，進一步造成流失壓力。\n3.政策建議\n(1)加強社區動員機制\nA.與里長合作建立「篩檢宣導責任區」，提升社區民眾對癌症篩檢重要性的認知。\nB.建立篩檢志工隊伍，協助通知、陪伴與交通支持，降低市民參與門檻。\n(2)制度修正\nA.建立「衛生所－篩檢院所－醫學中心」即時通報平台，避免訊息斷層。\nB.放寬轉診單規定，讓高風險個案能直接掛號。\nC.修法納入助產人員合法使用電子轉診系統。\n(3)人力支持與補償\n比照警消，核予第一線公衛護理師「危險加給」與「勤勞加給」， 以補償其專業付出。\n4.結論\n社區癌症篩檢政策應是惠民措施，而非淪為形式。政府若能同時：\n(1)建立有效的社區宣導與志工動員。\n(2)完善轉診與資訊制度。\n(3)給予第一線人員合理補償。\n才能真正提升都會型社區的篩檢完成率，守護市民健康，避免陷入「前端努力動員、 後端卻無法銜接」的雙輸局面。", "member": "張碩芳議員、陳韋曄議員", "date": "114/09/19", "tags": ["癌症與健康篩檢", "醫護人力與醫院營運", "婦幼與生育健康", "兒童早療與兒少保護", "偏鄉醫療與衛生所"]}, {"no": 259, "case": "P-1140919-0010", "term": "第3屆", "session": "第16次臨時會", "topic": "桃園市轄急診壅塞的情形以及解決方案，在市立醫院未建置好之前，市府的因應措施為何？\n1.急診壅塞已經是全國性、結構性的問題，桃園市相較其他5都急診醫療資源較為不足，唯一的醫學中心又鄰近雙北，服務廣大的雙北市民，故桃園市為解決轄內急診壅塞，籌設市立醫院刻不容緩。\n2.在市立醫院建置過程，衛生局如何改善急救責任醫院急診壅塞情形，並於需要時協助院內及院際協調且落實分級醫療，以舒緩急診壅塞狀況？", "member": "詹江村議員、謝美英議員、陳治文議員", "date": "114/09/19", "tags": ["醫院興建與醫療資源", "醫護人力與醫院營運"]}, {"no": 260, "case": "P-1140328-0007", "term": "第3屆", "session": "第14次臨時會", "topic": "本市為最年輕、人口正成長及新住民占比最多之直轄市，惟有鑑於全國生育率不斷下降及代謝症候群有年輕化趨勢，請針對以下提出專案報告：\n1.規劃設立「婦幼專責醫院」或「婦幼衛生所」，提供從備孕、產檢、生產及產後照顧等友善母嬰的專責服務。\n2.新住民社區關懷服務據點之現況。\n3.規劃擴大「慢性病健康管理」及照護能量之進度。", "member": "陳韋曄議員、張肇良議員", "date": "114/03/28", "tags": ["醫院興建與醫療資源", "婦幼與生育健康", "偏鄉醫療與衛生所", "洗腎與慢性病照護"]}, {"no": 261, "case": "P-1140328-0006", "term": "第3屆", "session": "第14次臨時會", "topic": "有關桃園市選定中壢八德平鎮交界處之八德區成立醫療專區桃園市立醫院乙案。\n1.煩請說明市立醫院設立之規模、面積、定位、床位數及期程。\n2.值此目前醫護人力嚴重短缺的情形之下，如何確保市立醫院於硬體設備完成後，醫護人力調度無虞？是否會影響到桃園市其他醫院醫護人力的流失？\n3.又婦幼局規畫於八德區成立婦幼衛生所，初期先請9家聯評機構醫師，在不影響原機構服務量能下輪流支援，然衛生所目前無法執行聯評，未來如何突破並符合法規要求？又本席曾提議由婦幼局作為桃園早療平台，進行資訊整合及調度中心，如此在無法增加早療醫護人力之情形下不致影響到各醫院的調度問題，此提議是否可行？再者本席亦曾提議，由桃園市衛生局與具有醫療科系之各大專院校進行學分建教合作計劃，為早療在有限的人力之下增加一些助力，此方案是否已在進行或討論中？", "member": "舒翠玲議員、謝美英議員", "date": "114/03/28", "tags": ["醫院興建與醫療資源", "醫護人力與醫院營運", "婦幼與生育健康", "兒童早療與兒少保護", "偏鄉醫療與衛生所"]}, {"no": 262, "case": "P-1140328-0005", "term": "第3屆", "session": "第14次臨時會", "topic": "桃園市目前常住原住民族人口已達9萬餘人，設籍人口亦有8萬6千餘人，雖各行政區皆以設置原住民族文化健康站，但隨著族人的老化及失能者的需求，原住民族文化健康站已漸不敷族人之用。又迴龍原住民長照大樓完工遙遙無期，族人需求又以日照中心為大宗，本席要求衛生局針對如何精進桃園市都會區原住民族人長照業務及評估試辦設置桃園市南北兩區原住民族日間照顧中心，提出專案報告。", "member": "張秀菊議員", "date": "114/03/28", "tags": ["長照服務", "原住民健康"]}, {"no": 263, "case": "P-1140328-0004", "term": "第3屆", "session": "第14次臨時會", "topic": "桃園市年度接種疫苗的預算分配，公費疫苗種類、公費接種年齡優先順序，以及年度疫苗預算執行成效，請衛生局提出專案報告。", "member": "于北辰議員", "date": "114/03/28", "tags": ["疫苗接種與補助"]}, {"no": 264, "case": "P-1140326-0011", "term": "第3屆", "session": "第14次臨時會", "topic": "航空城內清華大學附設醫院（文大用地）設置進度。\n1.113年已完成土地撥用程序，惟清大已與高醫大解約，市府與清大簽署MOU將於今（114）年8月到期。\n2.原衛福部核定之床位數為299床，未達醫學中心規模。\n3.桃園調整次醫療區域，新增「平德」次醫療區域，已規劃興建市立醫院。\n4.沿海地區，國道1號西側（蘆竹、大園、觀音、新屋）醫衛生局療資源缺乏，建請加速建置醫學中心。\n5.請說明\n（1） 清華大學附設醫院推動進度。\n（2） 與市府合建市立醫院可行性。\n（3）清大附醫規模規劃說明（24小時急診醫療、兒科急診、一般醫療住院、長照機構設置等等。）", "member": "徐其萬議員", "date": "114/03/26", "tags": ["醫院興建與醫療資源", "長照服務", "醫護人力與醫院營運", "偏鄉醫療與衛生所"]}, {"no": 265, "case": "N-1141127-0018", "term": "第3屆", "session": "第6次定期會", "topic": "本市醫學工程之規劃與推動情形?", "member": "陳治文議員", "date": "114/11/27", "tags": ["醫院興建與醫療資源"]}, {"no": const CATEGORIES = ["醫院興建與醫療資源", "長照服務", "疫苗接種與補助", "癌症與健康篩檢", "食品安全", "傳染病防治", "敬老愛心卡", "醫護人力與醫院營運", "心理衛生", "菸害防制與新興毒品", "原住民健康", "身心障礙與福利", "環境衛生與地方陳情", "行政庶務與函詢", "婦幼與生育健康", "兒童早療與兒少保護", "高齡福祉與健檢", "偏鄉醫療與衛生所", "資訊安全與個資", "社會安全網與跨局處協作", "預算與中央補助", "洗腎與慢性病照護", "藥物與管制", "醫美診所與消費爭議", "其他"];

// ---------- derive stats ----------
const memberCounts = {};
const sessionCounts = {};
DATA.forEach(r=>{
  memberCounts[r.member] = (memberCounts[r.member]||0)+1;
  sessionCounts[r.session] = (sessionCounts[r.session]||0)+1;
});
const members = Object.keys(memberCounts).sort((a,b)=>memberCounts[b]-memberCounts[a]);
const sessionOrder = ["第5次定期會","第6次定期會","第7次定期會","第14次臨時會","第15次臨時會","第16次臨時會","第17次臨時會","第18次臨時會","第21次臨時會","第22次臨時會","函詢"];
const extraSessions = Object.keys(sessionCounts).filter(s=>!sessionOrder.includes(s));
const sessions = sessionOrder.concat(extraSessions).filter(s=>sessionCounts[s]);

// ---------- state ----------
let state = {
  keyword: "",
  session: "",
  member: "",
  cats: new Set(),
  sort: "date-desc"
};

// ---------- header stats ----------
document.getElementById('statStrip').innerHTML = `
  <div class="stat"><div class="num">${DATA.length}</div><div class="lbl">總質詢題數</div></div>
  <div class="stat"><div class="num">${members.length}</div><div class="lbl">議員 / 來文機關數</div></div>
  <div class="stat"><div class="num">${sessions.length}</div><div class="lbl">涵蓋會期數</div></div>
  <div class="stat"><div class="num">${CATEGORIES.length-1}</div><div class="lbl">議題分類</div></div>
`;

// ---------- session select ----------
const sessionSelect = document.getElementById('sessionSelect');
sessionSelect.innerHTML = '<option value="">全部會期</option>' +
  sessions.map(s=>`<option value="${s}">${s}（${sessionCounts[s]}）</option>`).join('');
sessionSelect.addEventListener('change', e=>{ state.session = e.target.value; render(); });

// ---------- category chips ----------
function catCount(cat){
  return DATA.filter(r=>r.tags.includes(cat)).length;
}
const catChipsEl = document.getElementById('categoryChips');
function renderCatChips(){
  catChipsEl.innerHTML = CATEGORIES.map(cat=>{
    const active = state.cats.has(cat);
    return `<span class="chip ${active?'active':''}" data-cat="${cat}">${cat} <span class="n">${catCount(cat)}</span></span>`;
  }).join('');
  catChipsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const c = chip.getAttribute('data-cat');
      if(state.cats.has(c)) state.cats.delete(c); else state.cats.add(c);
      renderCatChips();
      renderActiveFilters();
      render();
    });
  });
  const badge = document.getElementById('catActiveCount');
  if(state.cats.size>0){ badge.style.display='inline-block'; badge.textContent = `已選 ${state.cats.size} 項`; }
  else badge.style.display='none';
}
renderCatChips();

// ---------- member filter ----------
const memberInput = document.getElementById('memberInput');
const memberDropdown = document.getElementById('memberDropdown');
function renderMemberDropdown(filterText){
  const ft = (filterText||"").trim();
  const list = members.filter(m=>!ft || m.includes(ft)).slice(0,30);
  memberDropdown.innerHTML = list.map(m=>{
    const sel = state.member===m ? 'selected':'';
    return `<div class="member-opt ${sel}" data-m="${m}"><span>${m}</span><span class="cnt">${memberCounts[m]} 題</span></div>`;
  }).join('') || '<div class="member-opt" style="color:#9aa3b2;">查無符合議員</div>';
  memberDropdown.querySelectorAll('.member-opt[data-m]').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const m = opt.getAttribute('data-m');
      state.member = state.member===m ? "" : m;
      memberInput.value = state.member;
      memberDropdown.classList.remove('show');
      renderActiveFilters();
      render();
    });
  });
}
memberInput.addEventListener('focus', ()=>{ renderMemberDropdown(memberInput.value); memberDropdown.classList.add('show'); });
memberInput.addEventListener('input', ()=>{
  if(memberInput.value===""){ state.member=""; }
  renderMemberDropdown(memberInput.value);
  memberDropdown.classList.add('show');
  render();
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.member-chips-wrap')) memberDropdown.classList.remove('show');
});

// ---------- keyword ----------
const keywordInput = document.getElementById('keywordInput');
let kwTimer=null;
keywordInput.addEventListener('input', ()=>{
  clearTimeout(kwTimer);
  kwTimer = setTimeout(()=>{ state.keyword = keywordInput.value.trim(); render(); }, 150);
});

// ---------- sort ----------
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });

// ---------- reset ----------
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = {keyword:"", session:"", member:"", cats:new Set(), sort:"date-desc"};
  keywordInput.value=""; sessionSelect.value=""; memberInput.value="";
  renderCatChips(); renderActiveFilters(); render();
});

// ---------- active filter pills ----------
function renderActiveFilters(){
  const pills = [];
  if(state.member) pills.push({label:`議員：${state.member}`, clear:()=>{state.member="";memberInput.value="";}});
  if(state.session) pills.push({label:`會期：${state.session}`, clear:()=>{state.session="";sessionSelect.value="";}});
  state.cats.forEach(c=>pills.push({label:c, clear:()=>{state.cats.delete(c); renderCatChips();}}));
  const wrap = document.getElementById('activeFilters');
  wrap.innerHTML = pills.map((p,i)=>`<span class="tag-pill" data-i="${i}">${p.label}<button>&times;</button></span>`).join('');
  wrap.querySelectorAll('.tag-pill').forEach((el,i)=>{
    el.querySelector('button').addEventListener('click', ()=>{
      pills[i].clear();
      renderActiveFilters();
      render();
    });
  });
}

// ---------- date parsing (ROC yyy/mm/dd) ----------
function dateKey(d){
  if(!d) return 0;
  const m = d.match(/(\d+)[\/\-](\d+)[\/\-](\d+)/);
  if(!m) return 0;
  return parseInt(m[1])*10000 + parseInt(m[2])*100 + parseInt(m[3]);
}

function highlight(text, kw){
  if(!kw) return escapeHtml(text);
  const esc = escapeHtml(text);
  try{
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    return esc.replace(re, s=>`<mark>${s}</mark>`);
  }catch(e){ return esc; }
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- render list ----------
function render(){
  let rows = DATA.filter(r=>{
    if(state.session && r.session!==state.session) return false;
    if(state.member && r.member!==state.member) return false;
    if(state.cats.size>0){
      let ok=false;
      for(const c of state.cats) if(r.tags.includes(c)) ok=true;
      if(!ok) return false;
    }
    if(state.keyword){
      const kw = state.keyword;
      if(!(r.topic.includes(kw) || r.member.includes(kw) || r.case.includes(kw))) return false;
    }
    return true;
  });

  rows.sort((a,b)=>{
    if(state.sort==='date-desc') return dateKey(b.date)-dateKey(a.date);
    if(state.sort==='date-asc') return dateKey(a.date)-dateKey(b.date);
    if(state.sort==='member') return a.member.localeCompare(b.member,'zh-Hant');
    if(state.sort==='no') return a.no-b.no;
    return 0;
  });

  document.getElementById('resultCount').textContent = rows.length;
  document.getElementById('totalCount').textContent = DATA.length;

  const container = document.getElementById('listContainer');
  if(rows.length===0){
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>查無符合條件的質詢紀錄</h3><div>請嘗試調整篩選條件或清除關鍵字</div></div>`;
    return;
  }

  const kw = state.keyword;
  container.innerHTML = rows.slice(0,600).map(r=>`
    <div class="card">
      <div class="card-top">
        <div class="who">
          <span class="member-name">${escapeHtml(r.member)}</span>
          <span class="meta-bits">
            <span class="badge-session">${escapeHtml(r.session)}</span>
            <span class="dot">・</span>
            <span>${escapeHtml(r.date)}</span>
            <span class="dot">・</span>
            <span class="case-no">${escapeHtml(r.case)}</span>
          </span>
        </div>
      </div>
      <div class="topic">${highlight(r.topic, kw)}</div>
      <div class="card-tags">${r.tags.map(t=>`<span class="card-tag">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
  `).join('');

  if(rows.length>600){
    container.innerHTML += `<div style="text-align:center;color:#9aa3b2;font-size:13px;padding:14px;">結果過多，僅顯示前 600 筆，請縮小篩選範圍以查看全部</div>`;
  }
}

renderMemberDropdown("");
renderActiveFilters();
render();
</script>
